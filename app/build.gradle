plugins {
    id 'com.android.application'
}

android {
    namespace 'com.camnav.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.camnav.app'
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName '2.2.1'
    }

    // one fixed key for every build (kept privately in the GitHub build cache, see build-apk.yml),
    // so a new APK installs over the old one
    def ks = System.getenv('KMAP_KEYSTORE')
    signingConfigs {
        kmap {
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword 'kmapkey'
                keyAlias 'kmap'
                keyPassword 'kmapkey'
            }
        }
    }

    buildTypes {
        debug {
            if (ks && file(ks).exists()) signingConfig signingConfigs.kmap
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
