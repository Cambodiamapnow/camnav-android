name: ElevenLabs voices into the app
# Runs when tools/eleven-batch.json changes: downloads the ElevenLabs recordings,
# cuts them into one clip per line and commits them to the app.
on:
  push:
    paths: ["tools/eleven-batch.json", "tools/split_eleven.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eleven-voices
  cancel-in-progress: true
jobs:
  voices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg (bundled with a Python package — fast, no apt)
        timeout-minutes: 5
        run: |
          pip install -q imageio-ffmpeg
          mkdir -p "$HOME/bin" && ln -sf "$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/ffmpeg" -version | head -1
      - run: python3 tools/split_eleven.py | tee voice-report.txt
      - name: Commit clips
        run: |
          git config user.name "CamNAV voice bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/voice/packs
          git diff --cached --quiet && echo "nothing new" || git commit -m "ElevenLabs voices for the voice characters" -m "$(tail -12 voice-report.txt)"
          git push
