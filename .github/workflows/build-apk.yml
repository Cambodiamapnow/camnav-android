name: Build APK

on:
  push:
    paths-ignore:
      - .github/workflows/cambodia-data.yml
      - .github/workflows/supabase-deploy.yml
      - tools/check_rng.py
      - supabase/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 runner images come with the Android SDK already installed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Cloud settings (Supabase) from repository secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e "const fs=require('fs'),f='app/src/main/assets/js/config.js',u=(process.env.SUPABASE_URL||'').trim(),k=(process.env.SUPABASE_ANON_KEY||'').trim();let s=fs.readFileSync(f,'utf8');s=s.replace(/supabaseUrl: \"[^\"]*\"/,'supabaseUrl: '+JSON.stringify(u)).replace(/supabaseAnonKey: \"[^\"]*\"/,'supabaseAnonKey: '+JSON.stringify(k));fs.writeFileSync(f,s);console.log(u?'cloud ON: '+u:'cloud OFF (no SUPABASE_URL secret)')"

      # ---- check the map style + take preview screenshots with the real map ----
      - name: Validate map styles
        run: |
          node -e "global.self=global;require('./app/src/main/assets/js/mapstyle.js');const fs=require('fs');fs.writeFileSync('style-dark.json',JSON.stringify(self.MapStyles.build('dark')));fs.writeFileSync('style-light.json',JSON.stringify(self.MapStyles.build('light')))"
          npx -y -p @maplibre/maplibre-gl-style-spec@20 gl-style-validate style-dark.json style-light.json

      - name: Preview screenshots
        run: |
          npm install --no-save --silent puppeteer-core@23
          node tools/preview.mjs

      # ---- natural Khmer voice (Azure neural TTS → MP3 clips inside the APK) ----
      - name: Restore Khmer voice cache
        uses: actions/cache@v4
        with:
          path: .voice-cache
          key: khmer-voice-${{ vars.ELEVEN_VOICE_ID || vars.KHMER_VOICE || 'km-KH-SreymomNeural' }}-${{ hashFiles('app/src/main/assets/js/voiceclips.js', 'app/src/main/assets/js/voicepacks.js') }}
          restore-keys: khmer-voice-${{ vars.ELEVEN_VOICE_ID || vars.KHMER_VOICE || 'km-KH-SreymomNeural' }}-

      - name: Make Khmer voice clips
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          KHMER_VOICE: ${{ vars.KHMER_VOICE }}
          KHMER_VOICE_RATE: ${{ vars.KHMER_VOICE_RATE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL }}
          ELEVEN_VOICE_ID: ${{ vars.ELEVEN_VOICE_ID }}
          ELEVEN_VOICE_TUKTUK_UNCLE: ${{ vars.ELEVEN_VOICE_TUKTUK_UNCLE }}
          ELEVEN_VOICE_CARING_MOM: ${{ vars.ELEVEN_VOICE_CARING_MOM }}
          ELEVEN_VOICE_HYPE_COACH: ${{ vars.ELEVEN_VOICE_HYPE_COACH }}
          ELEVEN_VOICE_GRANDPA: ${{ vars.ELEVEN_VOICE_GRANDPA }}
          ELEVEN_VOICE_LITTLE_SISTER: ${{ vars.ELEVEN_VOICE_LITTLE_SISTER }}
          ELEVEN_VOICE_FUNNY_GUY: ${{ vars.ELEVEN_VOICE_FUNNY_GUY }}
          ELEVEN_VOICE_WAR_CHIEF: ${{ vars.ELEVEN_VOICE_WAR_CHIEF }}
        run: python3 tools/make_khmer_voice.py

      - name: Build the APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk CamNAV.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamNAV-apk
          path: CamNAV.apk

      - name: Publish the APK on the Releases page (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CamNAV – នាំផ្លូវ build ${{ github.run_number }}
          files: |
            CamNAV.apk
            preview-dark.png
            preview-light.png
            preview-log.txt
          make_latest: true
